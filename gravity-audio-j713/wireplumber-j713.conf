# J713 speaker DSP is owned by this add-on. FIR data remains in Fedora's
# asahi-audio package; the microphone retains its generated J413 alias.
# Extends node.software-dsp.rules from asahi-audio's 99-asahi.conf.
node.software-dsp.rules = [
    {
        matches = [
            { api.alsa.path = "hw:AppleJ713,1" }
        ]
        actions = {
            create-filter = {
                filter-path = "/usr/share/asahi-audio/j713/graph.json"
                hide-parent = true
            }
        }
    }
    {
        matches = [
            { api.alsa.path = "hw:AppleJ713HPAI,0" }
        ]
        actions = {
            create-filter = {
                filter-path = "/usr/share/asahi-audio/j413/mic-j713.json"
                hide-parent = true
            }
        }
    }
]
