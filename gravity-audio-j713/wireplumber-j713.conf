# J713 (MacBook Air 13", M4, 2025): same chassis, speaker layout and three-mic
# array as the J413 and J613, so it uses the J413 speaker and mic graphs as
# asahi-audio does for the J613. WirePlumber appends these rules to the
# node.software-dsp.rules of asahi-audio's 99-asahi.conf. The two graph files
# are generated from asahi-audio's J413 graphs when either package is
# installed or updated.
node.software-dsp.rules = [
    {
        matches = [
            { api.alsa.path = "hw:AppleJ713,1" }
        ]
        actions = {
            create-filter = {
                filter-path = "/usr/share/asahi-audio/j413/graph-j713.json"
                hide-parent = true
            }
        }
    }
    {
        matches = [
            { api.alsa.path = "hw:AppleJ713HPAI,0" }
        ]
        actions = {
            create-filter = {
                filter-path = "/usr/share/asahi-audio/j413/mic-j713.json"
                hide-parent = true
            }
        }
    }
]
