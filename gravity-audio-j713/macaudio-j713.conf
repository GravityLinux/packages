Syntax 6

# J713 (MacBook Air 13", M4). Four amps (two woofers, two tweeters) on PCM 1
# like the J413/J613, and the CS42L84 jack on PCM 0. The T8132 card has no
# headset capture yet, so the jack is a headphone-only device: j713/HiFi.conf
# adds it next to the shared laptop verb. JackCodec matches none of the jack
# codecs that laptops/HiFi.conf knows, so that file adds no jack devices.

SectionUseCase."HiFi" {
	Comment "Default"
	Define.JackCodec "cs42l84-j713"
	Define.PlaybackChannels "4"
	Define.JackDevice "0"
	Define.SpeakerDevice "1"
	Define.SpeakerElem "Left Woofer Speaker Volume"
	File "/conf.d/macaudio/j713/HiFi.conf"
}
