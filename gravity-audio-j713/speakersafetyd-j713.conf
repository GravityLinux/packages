# J713: four SN012776 amplifiers; gain15 /18.5dBV.
# W thermal constants match M4 LSM18 and the existing J413 model.
# T thermal constants use M4 LSM19: positional correspondence to labelled spp3.
# 130C W /120C T are release policy, not decoded macOS temperature limits.
# Correctly paired V*I feedback is required; the reset-cache kernel fix must ship.
# No resistance-temperature or excursion observer is implemented by daemon2.0.1.
# Sense channels: the J713 amps send V before I (ADT vsense/isense slots 0/2,
# 4/6, 8/10, 12/14; 8 x 16-bit channels in rx_slot order LW, RW, LT, RT).
# 1024-frame reads bound the modeled 9/6V stress cases more tightly than4096.
# Physical control latency and feedback integrity still require validation.
[Globals]
visense_pcm = 2
t_ambient = 50.0
t_hysteresis = 5.0
t_window = 20.0
channels = 8
period = 1024
link_gains = True
uclamp_max = 64

[Controls]
vsense = VSENSE Switch
isense = ISENSE Switch
amp_gain = Amp Gain Volume
volume = Speaker Volume

