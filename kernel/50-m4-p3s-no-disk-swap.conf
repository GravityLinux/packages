# Installed by kernel-gravity-common. Disk swap on a P3S kernel has corrupted
# a root filesystem (2026-10-26); RAM-backed zram swap is unaffected and stays
# on. This keeps the Gravity image's swapfile unit from starting. Opt back in
# deliberately with m4_p3s.disk_swap=1 on the kernel command line.
[Unit]
ConditionKernelCommandLine=m4_p3s.disk_swap=1
