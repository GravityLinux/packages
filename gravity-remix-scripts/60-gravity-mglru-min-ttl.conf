# Multi-gen LRU thrashing prevention (Documentation/admin-guide/mm/multigen_lru.rst).
# With the kernel default of 0, a machine whose RAM and zram swap are full keeps
# evicting and re-reading file pages (program text, Btrfs metadata) for minutes
# before the OOM killer runs, and userspace (systemd-oomd, sshd, the compositor)
# stalls on the same page faults. 1000 ms makes kswapd invoke the OOM killer when
# the working set of the last second cannot be kept in memory. See SWAP-POLICY.md.
w- /sys/kernel/mm/lru_gen/min_ttl_ms - - - - 1000
